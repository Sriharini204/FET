<!DOCTYPE html>
<html>
<head>
  <style>

    body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      font-family: sans-serif;
    }


    header, nav, footer {
      grid-column: 1 / 3;
    }

    header, nav, section, article, footer {
      background: #f0f0f0;
      padding: 15px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

  <header><h1>Header</h1></header>
  <nav><a href="#">Home</a> | <a href="#">About</a></nav>
  
  <section><h2>Section</h2><p>Left side content</p></section>
  <article><h2>Article</h2><p>Right side content</p></article>
  
  <footer><p>Footer</p></footer>

</body>
</html>
